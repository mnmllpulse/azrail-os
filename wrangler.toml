# ─────────────────────────────────────────────────────────────────────
# ПЕСОЧНИЦА НА КОНТЕЙНЕРАХ
#
# Раскомментировать, когда контейнер будет создан. Код адаптеров уже
# написан (src/core/sandbox.ts, инструменты sandbox_exec и
# sandbox_preview) и включится сам: доступность вычисляется по наличию
# биндинга, а не зашита флагом.
#
# ВНИМАНИЕ: раскомментировать ДО создания контейнера нельзя — деплой
# упадёт на несуществующем биндинге. Сначала контейнер, потом эти строки.
#
# Что даёт: прогон тестов за секунды вместо минут через GitHub Actions,
# произвольные команды и предпросмотр поднятого сервера.
