name = "azrail-os-staging"
main = "src/index.ts"
compatibility_date = "2026-08-08"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = [ "/", "/api/*" ]

[[durable_objects.bindings]]
name = "Orchestrator"
class_name = "Orchestrator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Orchestrator"]

[[d1_databases]]
binding = "AZRAIL_D1"
database_name = "azrail-db-staging"
database_id = "REPLACE_STAGING_D1_ID"

[[kv_namespaces]]
binding = "AZRAIL_KV"
id = "REPLACE_STAGING_KV_ID"

[[r2_buckets]]
binding = "AZRAIL_R2"
bucket_name = "azrail-artifacts-staging"

[ai]
binding = "AI"

[triggers]
crons = ["*/10 * * * *"]

[vars]
AZRAIL_WORKERS_PLAN = "paid"
AZRAIL_FORCE_FREE = "true"
AZRAIL_METERING = "observe"
AZRAIL_MISSION_BUDGET_USD = "0.10"
AZRAIL_WRITE_BUDGET = "1000"
AI_GATEWAY_ID = "default"
CORS_ORIGIN = "REPLACE_STAGING_ORIGIN"

# Intentionally no container binding in staging.
# sandbox_* tools must report unavailable rather than silently using production.
