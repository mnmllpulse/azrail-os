name = "azrail-pulse-staging"
main = "src/unified.free.ts"
compatibility_date = "2026-09-29"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./site"
binding = "ASSETS"
html_handling = "none"
run_worker_first = true

[[durable_objects.bindings]]
name = "Orchestrator"
class_name = "Orchestrator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Orchestrator"]

[[d1_databases]]
binding = "AZRAIL_D1"
database_name = "azrail-db-staging"
database_id = "REPLACE_STAGING_D1_ID"

[[kv_namespaces]]
binding = "AZRAIL_KV"
id = "REPLACE_STAGING_KV_ID"

[[r2_buckets]]
binding = "AZRAIL_R2"
bucket_name = "azrail-artifacts-staging"

[ai]
binding = "AI"

[triggers]
crons = ["*/10 * * * *"]

[vars]
AUTH_MODE = "oidc"
PUBLIC_ORIGINS = "REPLACE_STAGING_ORIGIN"
OIDC_ISSUER = "REPLACE_STAGING_OIDC_ISSUER"
OIDC_CLIENT_ID = "REPLACE_STAGING_OIDC_CLIENT_ID"
AZRAIL_WORKERS_PLAN = "free"
AZRAIL_FORCE_FREE = "true"
AZRAIL_METERING = "enforce"
UNIFIED_LEDGER = "true"
DAILY_PROVIDER_CALLS = "20"
AZRAIL_MISSION_BUDGET_USD = "0.10"
AZRAIL_WRITE_BUDGET = "1000"
AI_GATEWAY_ID = "default"

# Intentionally no container binding in staging.
# sandbox_* tools must report unavailable rather than silently using production.
