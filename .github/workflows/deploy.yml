name: Deploy Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.ENABLE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
      INTEGRATION_KEY: ${{ secrets.INTEGRATION_KEY }}
      MCP_OAUTH_SECRETS: ${{ secrets.MCP_OAUTH_SECRETS }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MCP_SERVERS: ${{ vars.MCP_SERVERS }}
      AI_GATEWAY_ID: ${{ vars.AI_GATEWAY_ID || 'default' }}
      DAILY_PROVIDER_CALLS: ${{ vars.DAILY_PROVIDER_CALLS || '200' }}
      OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
      OIDC_CLIENT_ID: ${{ vars.OIDC_CLIENT_ID }}
      OPERATOR_ACCOUNT_IDS: ${{ vars.OPERATOR_ACCOUNT_IDS }}
      SANDBOX_PREVIEW_HOSTNAME: ${{ vars.SANDBOX_PREVIEW_HOSTNAME }}
      STUDIO_STORAGE_MAX_BYTES: ${{ vars.STUDIO_STORAGE_MAX_BYTES }}
      STUDIO_STORAGE_MAX_FILES: ${{ vars.STUDIO_STORAGE_MAX_FILES }}
      DEPLOY_PROFILE: ${{ vars.DEPLOY_PROFILE || 'free' }}
      WORKER_NAME: ${{ vars.WORKER_NAME || 'azrail-pulse' }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run deploy:ci
