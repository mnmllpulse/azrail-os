name: check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build UI
        run: |
          npm run build:ui
          npm run build:pulse

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Wrangler dry run
        run: npm run build:check
