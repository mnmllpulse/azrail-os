<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05010a">
<title>PULSE Globe</title>
<style>
:root{color-scheme:dark;--bg:#05010a;--accent:#b497f4;--text:#f5f2fb;--muted:#9f96ad}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#scene{position:fixed;inset:0}.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(70% 62% at 50% 48%,transparent 50%,rgba(0,0,0,.55) 100%)}
.hud{position:fixed;inset:0;pointer-events:none;padding:24px;color:var(--text);display:flex;justify-content:space-between;align-items:flex-start}
.brand{letter-spacing:.22em;font-size:12px;text-transform:uppercase}.brand b{display:block;font-size:18px;letter-spacing:.16em;margin-bottom:4px}.brand span{color:var(--muted);font-size:10px}
.status{border:1px solid rgba(180,151,244,.2);background:rgba(10,5,25,.45);backdrop-filter:blur(14px);border-radius:999px;padding:9px 13px;color:var(--muted);font-size:10px;letter-spacing:.14em}
.status i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);margin-right:8px}
.hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);color:var(--muted);font-size:10px;letter-spacing:.12em;pointer-events:none}
@media(max-width:640px){.hud{padding:16px}.brand b{font-size:15px}.status{display:none}.hint{bottom:14px;font-size:9px}}
@media(prefers-reduced-motion:reduce){.hint{display:none}}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="scene"></div><div class="vignette"></div>
<div class="hud"><div class="brand"><b>PULSE OS</b><span>Global Intelligence Network</span></div><div class="status"><i></i>ONLINE</div></div>
<div class="hint">drag · orbit &nbsp;&nbsp; scroll · zoom</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const mount=document.querySelector("#scene");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const mobile=matchMedia("(max-width: 640px)").matches;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x05010a);
scene.fog=new THREE.FogExp2(0x05010a,.013);

const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,1000);
camera.position.set(0,4,mobile?31:27);

const renderer=new THREE.WebGLRenderer({antialias:!mobile,alpha:false,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,mobile?1.3:1.8));
renderer.outputColorSpace=THREE.SRGBColorSpace;
mount.append(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.05;controls.enablePan=false;
controls.minDistance=15;controls.maxDistance=45;controls.rotateSpeed=.38;

scene.add(new THREE.AmbientLight(0x8e7cac,1.45));
const key=new THREE.DirectionalLight(0xf0eef5,2.4);key.position.set(35,26,40);scene.add(key);
const rim=new THREE.DirectionalLight(0x7b4dff,2.0);rim.position.set(-34,-10,-28);scene.add(rim);

const system=new THREE.Group();scene.add(system);
const radius=8;
const globe=new THREE.Mesh(
  new THREE.SphereGeometry(radius,mobile?64:96,mobile?48:72),
  new THREE.MeshStandardMaterial({color:0x10091d,roughness:.83,metalness:.08,emissive:0x130825,emissiveIntensity:.42})
);
system.add(globe);

const wire=new THREE.Mesh(
  new THREE.SphereGeometry(radius+.035,48,36),
  new THREE.MeshBasicMaterial({color:0x5c437f,wireframe:true,transparent:true,opacity:.075})
);
system.add(wire);

const atmosphere=new THREE.Mesh(
  new THREE.SphereGeometry(radius+.45,64,48),
  new THREE.MeshBasicMaterial({color:0x8a63ff,transparent:true,opacity:.055,side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false})
);
system.add(atmosphere);

const ringSpecs=[
  [radius+1.8,Math.PI/2.34,.16,.05,.12],
  [radius+3.1,Math.PI/2.03,-.30,.44,.09],
  [radius+4.5,Math.PI/1.78,.32,-.38,.065]
];
for(const [r,x,y,z,opacity] of ringSpecs){
  const ring=new THREE.Mesh(
    new THREE.TorusGeometry(r,.025,8,mobile?120:192),
    new THREE.MeshBasicMaterial({color:0xb497f4,transparent:true,opacity,blending:THREE.AdditiveBlending,depthWrite:false})
  );
  ring.rotation.set(x,y,z);scene.add(ring);
}

const satellites=[];
const satCount=mobile?3:6;
for(let i=0;i<satCount;i++){
  const orbit=new THREE.Group();
  orbit.rotation.set(Math.random()*Math.PI,Math.random()*Math.PI,Math.random()*Math.PI);
  const r=radius+2.1+Math.random()*4.2;
  const track=new THREE.Mesh(
    new THREE.TorusGeometry(r,.012,6,96),
    new THREE.MeshBasicMaterial({color:0x8d6ce0,transparent:true,opacity:.045})
  );
  track.rotation.x=Math.PI/2;orbit.add(track);
  const sat=new THREE.Mesh(new THREE.SphereGeometry(.09,10,10),new THREE.MeshBasicMaterial({color:0xd8c7ff}));
  orbit.add(sat);scene.add(orbit);
  satellites.push({orbit,sat,r,a:Math.random()*Math.PI*2,s:.08+Math.random()*.18});
}

if(!mobile){
  const count=800;
  const pts=new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const r=80+Math.random()*180,theta=Math.random()*Math.PI*2,phi=Math.acos(2*Math.random()-1);
    pts[i*3]=r*Math.sin(phi)*Math.cos(theta);pts[i*3+1]=r*Math.cos(phi);pts[i*3+2]=r*Math.sin(phi)*Math.sin(theta);
  }
  const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.BufferAttribute(pts,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x8b7da0,size:.16,transparent:true,opacity:.45,sizeAttenuation:true})));
}

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  if(!reduce) system.rotation.y+=0.00015*60*dt;
  satellites.forEach(s=>{s.a+=s.s*dt;s.sat.position.set(Math.cos(s.a)*s.r,0,Math.sin(s.a)*s.r)});
  controls.update();renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,matchMedia("(max-width: 640px)").matches?1.3:1.8));
});

window.parent?.postMessage({type:"pulse:globe-ready"},location.origin);
</script>
</body></html>
