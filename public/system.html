<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09080f">
<title>PULSE SYSTEM</title>
<style>
:root{color-scheme:dark;--bg:#09080f;--panel:#13101d;--line:#292333;--text:#f5f2fb;--muted:#aaa1b8;--accent:#b497f4;font:14px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 60% 10%,#171021 0,var(--bg) 42%);min-height:100vh;color:var(--text)}
header{display:flex;align-items:center;justify-content:space-between;padding:22px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(9,8,15,.9);backdrop-filter:blur(16px)}
header b{letter-spacing:.18em}a{color:var(--muted);text-decoration:none}.wrap{width:min(1120px,calc(100% - 32px));margin:36px auto}.eyebrow{color:var(--muted);font-size:10px;letter-spacing:.18em}.title{font-size:42px;letter-spacing:-.04em;margin:10px 0 8px}.lead{color:var(--muted);max-width:720px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.card,.section{border:1px solid var(--line);background:rgba(13,10,19,.78);border-radius:16px;padding:16px}.card b{display:block;font-size:22px}.card span{font-size:9px;color:var(--muted);letter-spacing:.12em}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.section h2{font-size:11px;letter-spacing:.14em;color:#cdb9ef;margin:0 0 12px}.kv{display:grid;grid-template-columns:minmax(120px,.8fr) 1fr;gap:10px;padding:8px 0;border-top:1px solid #211b29}.kv:first-child{border-top:0}.kv b{font-size:10px}.kv span{font-size:10px;color:var(--muted);overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#9d93a8;font:10px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}.notice{margin-top:14px;color:#a99fb5;font-size:11px}.connect{border:1px solid #49365f;background:#1c1427;color:#dbc9fa;border-radius:10px;padding:9px 12px;cursor:pointer}
@media(max-width:760px){.cards,.grid{grid-template-columns:1fr}.title{font-size:32px}.wrap{margin-top:22px}header{padding:16px}}
</style>
</head>
<body>
<header><b>PULSE SYSTEM</b><a href="/pulse.html">← CREATE</a></header>
<main class="wrap">
  <div class="eyebrow">AZRAIL · REAL RUNTIME DATA</div>
  <h1 class="title">System</h1>
  <p class="lead">Метрики, routing policy и лимиты показываются только из реальных API. Декоративные значения не используются.</p>
  <div class="cards">
    <div class="card"><b id="mode">AUTO</b><span>ROUTING MODE</span></div>
    <div class="card"><b id="budget">—</b><span>WRITE BUDGET</span></div>
    <div class="card"><b id="project">—</b><span>ACTIVE PROJECT</span></div>
  </div>
  <div class="grid">
    <section class="section"><h2>METRICS</h2><div id="metrics"></div></section>
    <section class="section"><h2>ROUTING POLICY</h2><div id="routing"></div></section>
    <section class="section"><h2>IDENTITY</h2><div id="identity"></div></section>
    <section class="section"><h2>ADVANCED DETAILS</h2><pre id="raw">—</pre></section>
  </div>
  <div class="notice" id="notice"></div>
</main>
<script src="/system.js" defer></script>
</body></html>
